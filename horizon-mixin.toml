[mod]
id = "smoothie_capes"
version = "0.5.1"

[compatibility]
horizon_revision = "298f16555756077684eef42631dcd0315c499ef6"

[[injection]]
id = "smoothie-cape"
target = "horizon_client_lib::mobs::render::cape"
kind = "OVERWRITE"
helper = "cape.rs"
bindings = [
  { name = "m", ty = "&Mob", value = "m" },
  { name = "alpha", ty = "f32", value = "alpha" },
  { name = "base", ty = "glam::Mat4", value = "base" },
  { name = "uv", ty = "[f32; 4]", value = "uv" },
  { name = "light", ty = "u32", value = "light" },
  { name = "data", ty = "&MobData", value = "data" },
  { name = "out", ty = "&mut Vec<Vertex>", value = "out" },
]

[[injection]]
id = "list"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
kind = "HEAD"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[module]]
id = "elytra-config"
file = "crates/horizon-client/src/game.rs"
name = "smoothie_elytra_config"
source = "elytra_config.rs"

[[injection]]
id = "settings"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings"
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

[[injection]]
id = "settings-click"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_click"
kind = "HEAD"
helper = "click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "button", ty = "usize", value = "button" },
]

[[injection]]
id = "player-elytra"
target = "horizon_client::game::perspective::Game<'_>::player_elytra_geometry"
kind = "HEAD"
cancellable = true
helper = "elytra.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "self" },
  { name = "m", ty = "&Mob", value = "m" },
  { name = "chest", ty = "Option<&str>", value = "chest" },
  { name = "camera", ty = "glam::DVec3", value = "camera" },
  { name = "partial", ty = "f32", value = "partial" },
  { name = "light", ty = "u32", value = "light" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]
